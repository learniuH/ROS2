launch:
  # 1.声明参数
  - arg:
      name: "launch_args_bgb"
      default: "255"
  # 2.调用参数
  - node:
      pkg: "turtlesim"
      exec: "turtlesim_node"
      param: 
        - name: "background_b"
          value: $(var launch_args_bgb)
  # 3.launch执行时动态传参
  # ros2 launch cpp01_launch yaml04_args_launch.yaml launch_args_bgb:=100