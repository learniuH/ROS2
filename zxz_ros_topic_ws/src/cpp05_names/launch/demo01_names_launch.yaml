  - node:
      pkg: "turtlesim"
      exec: "turtlesim_node"
      name: "turtle_yaml"
  - node:
      pkg: "turtlesim"
      exec: "turtlesim_node"
      namespace: "ns_yaml"
  - node:
      pkg: "turtlesim"
      exec: "turtlesim_node"
      namespace: "ns_yaml"
      name: "turtle_yaml"